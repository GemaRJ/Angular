<div class="container mt-4 text-center">
  <h2>Calculadora</h2>

  <input type="number" placeholder="Número 1" [(ngModel)]="num1" />

  <input type="number" placeholder="Número 2" [(ngModel)]="num2" />

  <br /><br />

  <button (click)="calcular('+')" class="me-2">+</button>

  <button (click)="calcular('-')" class="me-2">-</button>

  <button (click)="calcular('*')" class="me-2">*</button>

  <button (click)="calcular('/')">/</button>

  <h3>Resultado: {{ resultado }}</h3>

  <hr />

  <h3>Historial</h3>

  @for (item of historial; track $index) {
    <p>{{ item }}</p>
  }
</div>
